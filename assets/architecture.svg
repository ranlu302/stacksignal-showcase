<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc"><title id="title">StackSignal system architecture</title><desc id="desc">Two independent pipelines feed a Streamlit dashboard. Job postings flow through immutable capture, validation, skill extraction, versioned Parquet and pure metrics. JSA workbooks follow a separate trend pipeline. The SQLite career store feeds the application tracker. Docker packaging and offline CI are delivery support; the public demo is live.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8195A5" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1200" height="1060" rx="0" fill="#F5F8FA" stroke="#F5F8FA"/><text x="48" y="48" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087F82" font-weight="700">STACKSIGNAL / SYSTEM DESIGN</text><text x="48" y="93" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#142D43" font-weight="700">Separate inputs. Consistent outputs.</text><text x="48" y="128" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#536B7D" font-weight="400">Local batch processing with explicit data, publication and presentation boundaries.</text><rect x="36" y="160" width="735" height="505" rx="18" fill="#FFFFFF" stroke="#DCE5EB"/><rect x="795" y="160" width="369" height="505" rx="18" fill="#FFFFFF" stroke="#DCE5EB"/><text x="58" y="194" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087F82" font-weight="700">01 / JOB POSTINGS</text><text x="818" y="194" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#306BCD" font-weight="700">02 / OCCUPATION TRENDS</text><rect x="58" y="216" width="325" height="99" rx="18" fill="#F7FAFC" stroke="#DCE5EB"/><g transform="translate(73,241)" fill="none" stroke="#087F82" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h17l10 10v30H8z M25 3v11h10 M15 23h13 M15 30h13 M15 37h9"/></g><text x="135" y="255" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#142D43" font-weight="700">Provider adapters</text><text x="135" y="284" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#536B7D" font-weight="400">TheirStack / Adzuna¹</text><rect x="422" y="216" width="325" height="99" rx="18" fill="#F7FAFC" stroke="#DCE5EB"/><g transform="translate(437,241)" fill="none" stroke="#087F82" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10c0-9 36-9 36 0s-36 9-36 0v27c0 9 36 9 36 0V10 M5 23c0 9 36 9 36 0"/></g><text x="499" y="255" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#142D43" font-weight="700">Raw captures</text><text x="499" y="284" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#536B7D" font-weight="400">Immutable JSON / replay source</text><path d="M386 265H414" fill="none" stroke="#8195A5" stroke-width="2" marker-end="url(#arrow)"/><rect x="58" y="353" width="325" height="99" rx="18" fill="#F7FAFC" stroke="#DCE5EB"/><g transform="translate(73,378)" fill="none" stroke="#087F82" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h30v34H7z M14 18l4 4 10-11 M14 31h16"/></g><text x="135" y="392" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#142D43" font-weight="700">Validate &amp; normalize</text><text x="135" y="421" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#536B7D" font-weight="400">Pydantic / canonical records</text><rect x="422" y="353" width="325" height="99" rx="18" fill="#F7FAFC" stroke="#DCE5EB"/><g transform="translate(437,378)" fill="none" stroke="#087F82" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12h30 M8 24h30 M8 36h30 M17 7v10 M30 19v10 M20 31v10"/></g><text x="499" y="392" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#142D43" font-weight="700">Extract &amp; deduplicate</text><text x="499" y="421" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#536B7D" font-weight="400">Taxonomy / deterministic rules</text><path d="M584 316V331H219V345" fill="none" stroke="#8195A5" stroke-width="2" marker-end="url(#arrow)"/><path d="M386 402H414" fill="none" stroke="#8195A5" stroke-width="2" marker-end="url(#arrow)"/><rect x="58" y="490" width="325" height="99" rx="18" fill="#F7FAFC" stroke="#DCE5EB"/><g transform="translate(73,515)" fill="none" stroke="#087F82" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10c0-9 36-9 36 0s-36 9-36 0v27c0 9 36 9 36 0V10 M5 23c0 9 36 9 36 0"/></g><text x="135" y="529" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#142D43" font-weight="700">Publish a generation</text><text x="135" y="558" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#536B7D" font-weight="400">Parquet + processing state</text><rect x="422" y="490" width="325" height="99" rx="18" fill="#F7FAFC" stroke="#DCE5EB"/><g transform="translate(437,515)" fill="none" stroke="#087F82" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 42h37 M10 35V24h6v11 M23 35V15h6v20 M36 35V5h6v30"/></g><text x="499" y="529" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#142D43" font-weight="700">Market metrics</text><text x="499" y="558" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#536B7D" font-weight="400">Pure functions / Polars</text><path d="M584 453V470H219V482" fill="none" stroke="#8195A5" stroke-width="2" marker-end="url(#arrow)"/><path d="M386 539H414" fill="none" stroke="#8195A5" stroke-width="2" marker-end="url(#arrow)"/><rect x="818" y="216" width="322" height="99" rx="18" fill="#F7FAFC" stroke="#DCE5EB"/><g transform="translate(833,241)" fill="none" stroke="#306BCD" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h17l10 10v30H8z M25 3v11h10 M15 23h13 M15 30h13 M15 37h9"/></g><text x="895" y="255" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#142D43" font-weight="700">JSA workbook</text><text x="895" y="284" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#536B7D" font-weight="400">Internet Vacancy Index</text><rect x="818" y="353" width="322" height="99" rx="18" fill="#F7FAFC" stroke="#DCE5EB"/><g transform="translate(833,378)" fill="none" stroke="#306BCD" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12h30 M8 24h30 M8 36h30 M17 7v10 M30 19v10 M20 31v10"/></g><text x="895" y="392" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#142D43" font-weight="700">Trend processing</text><text x="895" y="421" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#536B7D" font-weight="400">Capture / normalize / Parquet</text><rect x="818" y="490" width="322" height="99" rx="18" fill="#F7FAFC" stroke="#DCE5EB"/><g transform="translate(833,515)" fill="none" stroke="#306BCD" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 42h37 M10 35V24h6v11 M23 35V15h6v20 M36 35V5h6v30"/></g><text x="895" y="529" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#142D43" font-weight="700">Trend metrics</text><text x="895" y="558" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#536B7D" font-weight="400">Monthly series / annual change</text><path d="M979 316V345" fill="none" stroke="#8195A5" stroke-width="2" marker-end="url(#arrow)"/><path d="M979 453V482" fill="none" stroke="#8195A5" stroke-width="2" marker-end="url(#arrow)"/><path d="M584 590V700H519V735" fill="none" stroke="#8195A5" stroke-width="2" marker-end="url(#arrow)"/><path d="M979 590V700H650V735" fill="none" stroke="#8195A5" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="744" width="494" height="120" rx="18" fill="#142D43" stroke="#142D43"/><g transform="translate(364,777)" fill="none" stroke="#71D5CC" stroke-width="2.6" stroke-linecap="round"